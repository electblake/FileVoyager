[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "filevoyager"
version = "0.2.0"
description = "A performance-focused PySide6 file browser for Windows"
requires-python = ">=3.12"
dependencies = [
    "pyside6==6.12.0",
    "comtypes==1.4.17",
    "numpy>=1.24.0",
    "pillow>=10.0.0",
    "platformdirs>=4.14.2",
    "scikit-learn>=1.7",
    "qt-themes==0.4.1",
]

[project.scripts]
filevoyager = "filevoyager.__main__:main"

[tool.setuptools.packages.find]
include = ["filevoyager*"]

[[tool.uv.index]]
url = "https://pypi.org/simple"

[tool.setuptools.package-data]
"filevoyager" = ["FileVoyager.ico"]
"filevoyager.image_processors" = ["LICENSE", "README.md"]
